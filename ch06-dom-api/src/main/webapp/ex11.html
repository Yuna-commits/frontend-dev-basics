<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script>
/**
 * 	1. Event Name (표준)
 		- load
 		- keydown -> keyup -> keypress
 		- mousemove, mouseover, mouseout
 		- mousedown -> mouseup -> mouseclick ... mousedown -> mouseup -> mouseclick
 			=> dbclick(double click)
 		- touch(mobile)
 		- submit
 		- focus, blur, change
 		
 	2. Event Attribute : DOM Event Model Lv.0 -> inline, basic
 		- onclick, onmouseover, onload, ...
 		ex) element.onclick = () => {};
 	
 	3. Event Listener : DOM Event Model Lv.2
 		ex) element.addEventListener("click", () => {}); 
 			... 여러 개 사용 가능
 */
 	window.onload = function() {
 		document
 			.querySelector("#header-2")
 			.onclick = function() {
 				console.log("Event Model Level.0 - Basic");
 			}
 		
 		document
 			.querySelector("#header-3")
 			.addEventListener("click", function() {
 				console.log("Event Model Level.0 - Basic");
 			});
 		
 		document
			.querySelector("#header-3")
			.addEventListener("click", function() {
				console.log("Event Model Level");
			});
 	}
</script>
</head>
<body>
	<h1>DOM(Document Object Model)</h1>
	<h2>5. Event 처리</h2>
	<h3 onclick="console.log('Event Model Level.0 - Inline')">Event Model Level.0 - Inline</h3>
	<h3 id='header-2'>Event Model Level.0 - Basic</h3>
	<h3 id='header-3'>Event Model Level.2</h3>
</body>
</html>
